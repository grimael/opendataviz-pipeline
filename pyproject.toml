[project]
name = "opendataviz-pipeline"
version = "1.0.0"
description = "ETL pipeline & dashboard for African economic data from World Bank API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Grimael"}]
keywords = ["data-engineering", "etl", "africa", "world-bank", "duckdb", "dashboard"]

dependencies = [
    "httpx>=0.27.0",
    "duckdb>=1.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    "pyreadstat>=1.2.7",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/grimael/opendataviz-pipeline"
Repository = "https://github.com/grimael/opendataviz-pipeline"
