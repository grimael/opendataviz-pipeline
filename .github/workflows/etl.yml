name: Daily ETL Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily (9 AM EAT)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL Pipeline
        run: python -m pipeline.main all

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Also stamp api/ with this run's timestamp: it's the only reliable
          # way to force Docker to invalidate its cached layer for `RUN
          # python -m pipeline.main all` in api/Dockerfile on Render. Without
          # it, a rebuild triggered when nothing under api/ or pipeline/
          # changed (the normal case — only the dashboard JSON changes daily)
          # reuses the cached layer wholesale and never re-fetches anything,
          # silently republishing the same stale data forever.
          date -u +%Y-%m-%dT%H:%M:%SZ > api/BUILD_STAMP
          git add dashboard/public/data/ api/BUILD_STAMP
          git diff --cached --quiet || git commit -m "chore: update dashboard data $(date +%Y-%m-%d)"
          git push

      # The dashboard (static site) picks up the commit above automatically —
      # Render redeploys on every push. The API is different: its data is
      # baked into a Docker image at build time (no persistent disk on the
      # free tier), so it stays frozen until something rebuilds it. This
      # hook is that trigger, keeping both in sync on the same daily cadence.
      - name: Trigger API redeploy on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
